[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-mcp"
version = "0.1.0"
description = "Stdio MCP server exposing typed tools over the NetBox REST API, with a preview-before-apply write gate"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alexander Begoon", email = "alexander.begoon@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/alexbegoon/netbox-mcp"

[project.scripts]
netbox-mcp = "netbox_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
